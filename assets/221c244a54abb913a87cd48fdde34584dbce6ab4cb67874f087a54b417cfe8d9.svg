<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">FrameCode 功能演示</title>
  <desc id="desc">深色背景上的代码窗口与彩色代码行</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#151a25"/>
      <stop offset="1" stop-color="#26364c"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="150" y="105" width="900" height="420" rx="24" fill="#10141d" stroke="#52657f" stroke-width="3"/>
  <circle cx="205" cy="158" r="12" fill="#f06a6a"/><circle cx="242" cy="158" r="12" fill="#efbe58"/><circle cx="279" cy="158" r="12" fill="#58c383"/>
  <text x="205" y="245" fill="#70d6ff" font-family="Consolas, monospace" font-size="34">const</text>
  <text x="330" y="245" fill="#f4f7fb" font-family="Consolas, monospace" font-size="34">demo = {</text>
  <text x="255" y="315" fill="#d5b7ff" font-family="Consolas, monospace" font-size="34">feature:</text>
  <text x="445" y="315" fill="#9be49b" font-family="Consolas, monospace" font-size="34">'FrameCode',</text>
  <text x="255" y="385" fill="#d5b7ff" font-family="Consolas, monospace" font-size="34">ready:</text>
  <text x="420" y="385" fill="#ffcf7f" font-family="Consolas, monospace" font-size="34">true</text>
  <text x="205" y="455" fill="#f4f7fb" font-family="Consolas, monospace" font-size="34">};</text>
</svg>
