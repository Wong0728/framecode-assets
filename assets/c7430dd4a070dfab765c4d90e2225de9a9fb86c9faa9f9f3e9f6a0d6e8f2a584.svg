<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="760" viewBox="0 0 1000 760">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .side { stroke: #111827; stroke-width: 4.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .altitude { stroke: #2563eb; stroke-width: 2.8; fill: none; stroke-linecap: round; }
      .orthic { stroke: #dc2626; stroke-width: 3.6; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .point { fill: #111827; }
      .label { font-family: "Times New Roman", serif; font-size: 30px; font-style: italic; fill: #111827; }
      .len { font-family: "Times New Roman", serif; font-size: 24px; font-weight: 700; fill: #b91c1c; paint-order: stroke; stroke: #ffffff; stroke-width: 5px; stroke-linejoin: round; }
      .right { stroke: #2563eb; stroke-width: 2.6; fill: none; }
    </style>
  </defs>

  <rect width="100%" height="100%" class="bg"/>

  <!-- △ABC -->
  <line x1="90" y1="650" x2="340" y2="110" class="side"/>
  <line x1="340" y1="110" x2="640" y2="470" class="side"/>
  <line x1="640" y1="470" x2="90" y2="650" class="side"/>

  <!-- 三条高 -->
  <line x1="90" y1="650" x2="560" y2="365" class="altitude"/>
  <line x1="340" y1="110" x2="530" y2="510" class="altitude"/>
  <line x1="640" y1="470" x2="255" y2="315" class="altitude"/>

  <!-- △DEF -->
  <line x1="255" y1="315" x2="560" y2="365" class="orthic"/>
  <line x1="560" y1="365" x2="530" y2="510" class="orthic"/>
  <line x1="530" y1="510" x2="255" y2="315" class="orthic"/>

  <!-- 直角符号 -->
  <polyline points="247,333 264,340 271,323" class="right"/>
  <polyline points="549,350 534,359 543,374" class="right"/>
  <polyline points="513,515 507,499 523,493" class="right"/>

  <!-- 点 -->
  <circle cx="90" cy="650" r="5.5" class="point"/>
  <circle cx="340" cy="110" r="5.5" class="point"/>
  <circle cx="640" cy="470" r="5.5" class="point"/>
  <circle cx="255" cy="315" r="5.5" class="point"/>
  <circle cx="560" cy="365" r="5.5" class="point"/>
  <circle cx="530" cy="510" r="5.5" class="point"/>

  <!-- 点名 -->
  <text x="55" y="680" class="label">A</text>
  <text x="330" y="92" class="label">B</text>
  <text x="655" y="495" class="label">C</text>
  <text x="220" y="312" class="label">D</text>
  <text x="575" y="360" class="label">E</text>
  <text x="523" y="545" class="label">F</text>

  <!-- 长度标注 -->
  <text x="400" y="330" class="len">15</text>
  <text x="570" y="445" class="len">8</text>
  <text x="368" y="430" class="len">17</text>
</svg>